apiVersion: batch/v1
kind: Job
metadata:
  name: jhof-fetch-data
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: fetch-data
          image: ghcr.io/jannikh00/higgs-k8s-gpu-benchmark:e3753e23128deae9138e6a265f7b55380c72b143
          command: ["python3", "src/fetch_data.py", "--out-dir", "/data"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jhof-higgs-data
