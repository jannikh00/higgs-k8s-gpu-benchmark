apiVersion: batch/v1
kind: Job
metadata:
  name: jhof-train-cpu
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
        # Same zone as the GPU run, so both see identical storage locality.
        # Reading this volume from another region drops throughput to very little
        topology.kubernetes.io/zone: ucsd
      containers:
        - name: train-cpu
          image: ghcr.io/jannikh00/higgs-k8s-gpu-benchmark:cdfca6a9c70464c39d4589aa78e74dc9bcfcc26d
          command:
            - python3
            - src/train.py
            - --device
            - cpu
            - --threads
            - "8"
            - --batch-size
            - "1024"
            - --data-path
            - /data/HIGGS.csv
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "8"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 16Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jhof-higgs-data
