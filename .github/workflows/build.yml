name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jannikh00/higgs-k8s-gpu-benchmark:latest
            ghcr.io/jannikh00/higgs-k8s-gpu-benchmark:${{ github.sha }}
          # The cu124 torch stack is ~3 GB of wheels; cache it between pushes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
